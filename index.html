<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>odin flash</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"><style>:root{font-family:Roboto,Arial,sans-serif;color:#202124;background:#f8f9fa;--accent:#1967d2;--line:#dadce0}*{box-sizing:border-box}body{margin:0}.bar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;font-size:20px;font-weight:500}.bar span{color:var(--accent);margin-right:10px}.wrap{max-width:760px;margin:42px auto;padding:0 24px}.stepper{display:flex;gap:8px;margin-bottom:42px}.step{height:4px;flex:1;background:#e0e3e7}.step.on{background:var(--accent)}h1{font-size:32px;margin:0 0 12px;font-weight:500}p{color:#5f6368;line-height:1.5}.panel{background:#fff;border:1px solid var(--line);padding:28px;margin-top:28px}.state{display:flex;align-items:center;gap:12px;font-size:16px;margin:18px 0}.state i{color:var(--accent)}button{border:0;background:var(--accent);color:#fff;padding:12px 20px;font-size:14px;font-weight:500;cursor:pointer}button:disabled{background:#9aa0a6}.actions{display:flex;justify-content:flex-end;margin-top:28px}.warning{border-left:3px solid #b06000;padding:12px 16px;background:#fff8e1;color:#5f4500}.log{font:13px ui-monospace,monospace;background:#202124;color:#e8eaed;padding:14px;min-height:90px;white-space:pre-wrap}.meta{font-size:13px;color:#5f6368}</style></head><body><header class="bar"><span>odin</span> Xiaomi MIX 4 刷机</header><main class="wrap"><div class="stepper" id="steps"></div><section id="app"></section></main><script type="module">const BASE='https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS1.0.2.0.UKMCNXM/odin_images_OS1.0.2.0.UKMCNXM_20240425.0000.00_14.0_cn_d3eb80577c.tgz';const TWRP='https://github.com/rponeawa/odin-android-flash/releases/latest/download/qlp_twrp.img';const steps=['fastboot','底包','TWRP','授权','刷机包','完成'];let n=0;const app=document.querySelector('#app');const ss=document.querySelector('#steps');function render(){ss.innerHTML=steps.map((x,i)=>`<div class="step ${i<=n?'on':''}"></div>`).join('');const views=[fastboot,base,twrp,auth,rom,done];app.innerHTML=views[n]()}function next(){n=Math.min(n+1,5);render()}function fastboot(){return `<h1>连接设备</h1><p>将 MIX 4 进入 fastboot 模式并通过 USB 连接。已在 fastboot 的设备可直接继续。</p><div class="panel"><div class="state"><i class="material-icons">usb</i><span id="device">等待设备</span></div><div class="meta">浏览器不会上传设备数据</div><div class="actions"><button onclick="window.nextStep()">我已进入 fastboot</button></div></div>`}function base(){return `<h1>刷入官方底包</h1><p>使用清除所有数据的方式刷入官方底包，完成后保持在 fastboot。</p><div class="warning">此操作会清除手机上的全部数据。</div><div class="panel"><div class="state"><i class="material-icons">download</i><span>底包来自小米官方 OSS</span></div><a href="${BASE}" target="_blank">查看下载地址</a><div class="actions"><button onclick="window.nextStep()">底包已完成</button></div></div>`}function twrp(){return `<h1>临时启动 TWRP</h1><p>临时启动 recovery，不写入 boot 分区。</p><div class="panel"><div class="state"><i class="material-icons">memory</i><span>qlp_twrp.img</span></div><a href="${TWRP}" target="_blank">下载 TWRP 镜像</a><div class="actions"><button onclick="window.nextStep()">已进入 TWRP</button></div></div>`}function auth(){return `<h1>采集授权信息</h1><p>在 TWRP 中进入 ADB sideload，使用本地工具生成授权请求包。</p><div class="panel"><div class="state"><i class="material-icons">vpn_key</i><span>等待 request.zip</span></div><div class="log">请运行采集工具，完成后选择生成的 request.zip</div><div class="actions"><button onclick="window.nextStep()">授权包已刷入</button></div></div>`}function rom(){return `<h1>刷入刷机包</h1><p>进入 ADB sideload，选择带“秋城落叶”的刷机包。文件由 GitHub Release 提供。</p><div class="panel"><div class="state"><i class="material-icons">inventory_2</i><span>选择版本</span></div><select id="releases" style="padding:10px;width:100%;margin:12px 0"><option>正在读取版本…</option></select><a href="https://github.com/rponeawa/odin-android-flash/releases" target="_blank">打开下载页面</a><div class="actions"><button onclick="window.nextStep()">刷入完成，重启系统</button></div></div>`}function done(){return `<h1>完成</h1><p>设备正在重启。首次启动可能需要几分钟。</p><div class="panel"><div class="state"><i class="material-icons">check_circle</i><span>刷机流程完成</span></div></div>`}window.nextStep=next;render();fetch('https://api.github.com/repos/rponeawa/odin-android-flash/releases').then(r=>r.json()).then(rs=>{const e=document.querySelector('#releases');if(e)e.innerHTML=rs.filter(x=>x.name&&!x.name.includes('底包')).map(x=>`<option value="${x.html_url}">${x.name}</option>`).join('')||'<option>暂无刷机包</option>'}).catch(()=>{});</script></body></html>
