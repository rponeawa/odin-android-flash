name: Publish synchronized Mega ROM
"on":
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Find latest range artifacts
        id: ids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | [.id,.name,.created_at] | @tsv' | sort -k2,2 -k3,3r | awk '$2=="mega-sync-a"&&!a++{print "a=" $1} $2=="mega-sync-b"&&!b++{print "b=" $1}' > ids.txt
          cat ids.txt >> "$GITHUB_OUTPUT"
          if grep -q '^a=' ids.txt && grep -q '^b=' ids.txt; then
            echo "found=yes" >> "$GITHUB_OUTPUT"
          else
            echo "两侧 range artifact 尚未齐备，本轮无事可做"
            echo "found=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Read range metadata
        id: meta
        if: steps.ids.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          A_ID: ${{ steps.ids.outputs.a }}
          B_ID: ${{ steps.ids.outputs.b }}
        run: |
          set -euo pipefail
          mkdir -p ranges
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$A_ID/zip" > ranges/a.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$B_ID/zip" > ranges/b.zip
          title_a=$(unzip -p ranges/a.zip rom-name.txt)
          title_b=$(unzip -p ranges/b.zip rom-name.txt)
          test "$title_a" = "$title_b"
          size_a=$(unzip -p ranges/a.zip rom-size.txt)
          size_b=$(unzip -p ranges/b.zip rom-size.txt)
          test "$size_a" = "$size_b"
          echo "title=$title_a" >> "$GITHUB_OUTPUT"
          echo "size=$size_a" >> "$GITHUB_OUTPUT"
      - name: Skip when the ROM is already released
        id: gate
        if: steps.ids.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.meta.outputs.title }}
        run: |
          set -euo pipefail
          if gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json name --jq '.[].name' | grep -Fxq "$TITLE"; then
            echo "$TITLE 已发布，跳过"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Split and publish
        if: steps.gate.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.meta.outputs.title }}
          SIZE: ${{ steps.meta.outputs.size }}
        run: |
          set -euo pipefail
          tag="rom-$(date -u +%Y%m%d%H%M%S)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes '由 Mega watcher 自动同步。分卷按文件名顺序拼接。'
          published=0
          for side in a b; do
            unzip -p "ranges/$side.zip" "range-$side.bin" > "ranges/range-$side.bin"
            rm -f "ranges/$side.zip"
            published=$((published + $(wc -c < "ranges/range-$side.bin")))
            split -b 1900m -d -a 3 "ranges/range-$side.bin" "ranges/odin-rom.zip.part-$side-"
            rm -f "ranges/range-$side.bin"
            for f in ranges/odin-rom.zip.part-$side-*; do
              gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
              rm -f "$f"
            done
          done
          test "$published" = "$SIZE"
          echo "已发布 $TITLE，共 $published 字节"
