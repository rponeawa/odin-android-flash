name: Publish missing ROM chunk
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact b
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and .name == "mega-range-b") | .id' | head -1)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > artifact.zip
          unzip -p artifact.zip > range-b.bin
          split -b 1900m -d -a 3 range-b.bin odin-rom.zip.part-b-
          for f in odin-rom.zip.part-b-*; do gh release upload rom-latest "$f" --repo "$GITHUB_REPOSITORY" --clobber; done
