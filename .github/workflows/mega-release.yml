name: Sync Mega ROM releases
"on":
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view rom-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create rom-latest --repo "$GITHUB_REPOSITORY" --title 'odin-Android17-HyperOS4.0.0.35-秋城落叶-20260907_0203-Release.zip' --notes '由 Mega 同步。分卷按文件名顺序拼接。'
      - name: Locate completed Mega artifacts
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | [.id,.name,.workflow_run.id] | @tsv' | awk '$2=="mega-range-a" {print "a=" $1} $2=="mega-range-b" {print "b=" $1}' >> "$GITHUB_OUTPUT"
          test -s "$GITHUB_OUTPUT"
      - name: Download and publish split assets
        env:
          GH_TOKEN: ${{ github.token }}
          A_ID: ${{ steps.find.outputs.a }}
          B_ID: ${{ steps.find.outputs.b }}
        run: |
          set -euo pipefail
          mkdir -p work
          for pair in "a:$A_ID" "b:$B_ID"; do
            id=${pair#*:}; side=${pair%%:*}
            gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "work/$side.zip"
            unzip -p "work/$side.zip" > "work/range-$side.bin"
            split -b 1900m -d -a 3 "work/range-$side.bin" "work/odin-rom.zip.part-$side-"
            for f in work/odin-rom.zip.part-$side-*; do
              gh release upload rom-latest "$f" --repo "$GITHUB_REPOSITORY" --clobber
            done
          done
