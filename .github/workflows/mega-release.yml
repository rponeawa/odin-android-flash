name: Sync Mega ROM releases
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    timeout-minutes: 360
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Resolve newest Mega ROM
        id: resolve
        run: |
          meta=$(MEGA_FOLDER_URL='https://mega.nz/folder/1vEx1Taa#YvX3h6dBTljL9X5TdsX0HQ' node scripts/mega-link.mjs)
          echo "name=$(echo "$meta" | jq -r .name)" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$meta" | jq -r .url)" >> "$GITHUB_OUTPUT"
      - name: Download and split ROM with Mega JS streaming
        run: |
          set -euo pipefail
          mkdir -p dist
          MEGA_FOLDER_URL='https://mega.nz/folder/1vEx1Taa#YvX3h6dBTljL9X5TdsX0HQ' node scripts/sync-mega.mjs
          cat dist/rom.json
      - name: Publish release when content changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(cat dist/sha256.txt); tag="rom-$sha"
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh release create "$tag" dist/odin-rom.zip.part-* --title "刷机包 $sha" --notes "来源：Mega 公共文件夹。SHA-256: $sha"
