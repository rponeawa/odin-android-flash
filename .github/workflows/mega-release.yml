name: Sync Mega ROM releases
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: echo "tag=rom-latest" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view rom-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create rom-latest --repo "$GITHUB_REPOSITORY" --title '最新刷机包' --notes '由 Mega 同步。分卷按文件名顺序拼接。'
  ranges:
    needs: prepare
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: a
            start: 0
            end: 4457865579
          - id: b
            start: 4457865580
            end: 8915731159
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Download Mega range
        env:
          MEGA_FOLDER_URL: https://mega.nz/folder/1vEx1Taa#YvX3h6dBTljL9X5TdsX0HQ
          RANGE_START: ${{ matrix.start }}
          RANGE_END: ${{ matrix.end }}
          OUTPUT: range-${{ matrix.id }}.bin
        run: node scripts/mega-range.mjs
      - name: Split and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          split -b 1900m -d -a 3 "range-${{ matrix.id }}.bin" "odin-rom.zip.part-${{ matrix.id }}-"
          for f in odin-rom.zip.part-${{ matrix.id }}-*; do
            for n in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber; then break; fi
              sleep 10
            done
          done
