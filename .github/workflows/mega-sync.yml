name: Mega ROM sync
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      title: ${{ steps.gate.outputs.title }}
      size: ${{ steps.gate.outputs.size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Read the newest ROM's name and size
        env:
          MEGA_FOLDER_URL: https://mega.nz/folder/1vEx1Taa#YvX3h6dBTljL9X5TdsX0HQ
          NAME_OUTPUT: rom-name.txt
          SIZE_OUTPUT: rom-size.txt
        run: node scripts/mega-range.mjs
      - name: Publish only when the name is new
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title=$(cat rom-name.txt)
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "size=$(cat rom-size.txt)" >> "$GITHUB_OUTPUT"
          if gh release list --limit 200 --json name --jq '.[].name' | grep -Fxq "$title"; then
            echo "$title 已发布，本次不下载"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi
  download-a:
    # 只下前半；为什么分两半、为什么串行，见下面 download-b 的说明
    needs: check
    if: needs.check.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Download the first half
        env:
          MEGA_FOLDER_URL: https://mega.nz/folder/1vEx1Taa#YvX3h6dBTljL9X5TdsX0HQ
          RANGE_SIDE: a
          OUTPUT: range-a.bin
          NAME_OUTPUT: rom-name.txt
          SIZE_OUTPUT: rom-size.txt
        run: node scripts/mega-range.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mega-a
          path: |
            range-a.bin
            rom-name.txt
            rom-size.txt
          compression-level: 0
          retention-days: 1
  download-b:
    # ROM 有 8 GB 出头，而 Mega 未登录时单次下载上限 5 GB，所以整包必须分成
    # 两半分别下载，不能合成一个 job 一次拿完。串在 a 之后是为了不让两次下载
    # 同时占用同一个账号的额度。
    needs: [check, download-a]
    if: needs.check.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Download the second half
        env:
          MEGA_FOLDER_URL: https://mega.nz/folder/1vEx1Taa#YvX3h6dBTljL9X5TdsX0HQ
          RANGE_SIDE: b
          OUTPUT: range-b.bin
          NAME_OUTPUT: rom-name.txt
          SIZE_OUTPUT: rom-size.txt
        run: node scripts/mega-range.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mega-b
          path: |
            range-b.bin
            rom-name.txt
            rom-size.txt
          compression-level: 0
          retention-days: 1
  publish:
    needs: [check, download-a, download-b]
    if: needs.check.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: mega-a, path: a }
      - uses: actions/download-artifact@v4
        with: { name: mega-b, path: b }
      - name: Split and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.check.outputs.title }}
          SIZE: ${{ needs.check.outputs.size }}
        run: |
          set -euo pipefail
          # 两半必须是同一个包：下载期间 Mega 上换了文件就会不一致
          test "$(cat a/rom-name.txt)" = "$(cat b/rom-name.txt)"
          test "$(cat a/rom-name.txt)" = "$TITLE"
          tag="rom-$(date -u +%Y%m%d%H%M%S)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes '由 Mega 同步。分卷按文件名顺序拼接。'
          published=0
          for side in a b; do
            mv "a/range-$side.bin" "range-$side.bin" 2>/dev/null || mv "b/range-$side.bin" "range-$side.bin"
            published=$((published + $(wc -c < "range-$side.bin")))
            split -b 1900m -d -a 3 "range-$side.bin" "odin-rom.zip.part-$side-"
            rm -f "range-$side.bin"
            for f in odin-rom.zip.part-$side-*; do
              gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY"
              rm -f "$f"
            done
          done
          test "$published" = "$SIZE"
          echo "已发布 $TITLE，共 $published 字节"
