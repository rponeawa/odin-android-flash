name: Mega ROM watcher
on:
  schedule:
    - cron: "17 */12 * * *"
    - cron: "47 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  download-a:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Download Mega first range
        env:
          MEGA_FOLDER_URL: https://mega.nz/folder/1vEx1Taa#YvX3h6dBTljL9X5TdsX0HQ
          RANGE_SIDE: a
          OUTPUT: range-a.bin
          NAME_OUTPUT: rom-name.txt
          SIZE_OUTPUT: rom-size.txt
        run: node scripts/mega-range.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mega-sync-a
          path: |
            range-a.bin
            rom-name.txt
            rom-size.txt
          compression-level: 0
          retention-days: 3
  download-b:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 */12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Download Mega second range
        env:
          MEGA_FOLDER_URL: https://mega.nz/folder/1vEx1Taa#YvX3h6dBTljL9X5TdsX0HQ
          RANGE_SIDE: b
          OUTPUT: range-b.bin
          NAME_OUTPUT: rom-name.txt
          SIZE_OUTPUT: rom-size.txt
        run: node scripts/mega-range.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mega-sync-b
          path: |
            range-b.bin
            rom-name.txt
            rom-size.txt
          compression-level: 0
          retention-days: 3
