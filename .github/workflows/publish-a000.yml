name: Restore first ROM chunk
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Download completed range artifact
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and .name == "mega-range-a")][0].id')
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > artifact.zip
          unzip -p artifact.zip > range-a.bin
      - name: Upload first chunk
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -euo pipefail
          split -b 1900m -d -a 3 range-a.bin chunk-a-
          gh release upload rom-latest chunk-a-000 --repo "$GITHUB_REPOSITORY" --clobber
